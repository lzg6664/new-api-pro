# New-API Docker Compose Configuration
# 
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and SQL_DSN line 15
#   2. Uncomment the mysql service and SQL_DSN line 16
#   3. Uncomment mysql in depends_on (line 28)
#   4. Uncomment mysql_data in volumes section (line 64)
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

# New-API Docker Compose Configuration
# 
# 快速启动:
#   docker compose up -d
#   访问: http://localhost:3000
#
# ⚠️  生产环境请修改所有默认密码!

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-api:local
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SQL_DSN=postgresql://root:123456@host.docker.internal:5432/new-api  # ⚠️ 连宿主机 PostgreSQL，生产环境请修改密码
      - REDIS_CONN_STRING=redis://:123456@redis:6379                        # ⚠️ 生产环境请修改密码
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - MAX_REQUEST_BODY_MB=1024
      - NODE_NAME=new-api-node-1
    #  - SESSION_SECRET=random_string  # 多机部署时必须设置
    #  - STREAMING_TIMEOUT=300         # 流模式超时(秒), 默认120
    depends_on:
      - redis
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # ⚠️ 生产环境请修改密码
    networks:
      - new-api-network

networks:
  new-api-network:
    driver: bridge
